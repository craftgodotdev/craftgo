output:
  types:      ./internal/types
  transport:  ./internal/transport
  routes:     ./internal/routes
  service:    ./internal/service
  svccontext: ./svccontext/svccontext.go
  openapi:    ./docs/openapi.yaml
  main:       "-"
events:
  targets:
    - lang: go
      out: ./internal/events
openapi:
  title:    Matrix API
  version:  1.0.0
  basePath: /api
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer
    AdminWriteScope:
      type: http
      scheme: bearer
    MFA:
      type: apiKey
      in: header
      name: X-MFA-Token
    ProfileAuth:
      type: http
      scheme: bearer
