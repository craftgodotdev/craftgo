name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job only reads the repo.
permissions:
  contents: read

# Cancel superseded runs on the same branch / PR to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, module tidiness, vulnerability scan, and the codegen drift gate. All
  # OS-independent, so they run once on Linux; the cross-OS suite is the `test`
  # job below.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod # single source of truth for the Go version
          cache: true

      - name: vet
        run: make vet

      - name: fmt-check
        run: make fmt-check

      - name: tidy-check
        run: make tidy-check

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      # The event runtime, its adapters and the pass-through wire type are
      # their own modules, so the root run does not reach them.
      - name: golangci-lint (event runtime module)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: pkg/events
      - name: golangci-lint (nats adapter module)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: pkg/events/nats
      - name: golangci-lint (kafka adapter module)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: pkg/events/kafka
      - name: golangci-lint (wire module)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: pkg/wire

      # Fails on a known vulnerability that the code actually reaches (call-graph
      # analysis); advisory-only findings in unused code do not break the build.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: build root + submodules
        run: make build-all

      # Regenerate every example and the e2e fixture from current source; any
      # difference from the committed output is a codegen regression.
      - name: drift gate (gen output must match committed)
        run: make gen-diff

  # The project ships binaries for Linux, macOS, and Windows, so the suite runs
  # on each - catching path / file / line-ending bugs a Linux-only run misses.
  # The race detector needs a C toolchain the Windows runner lacks, so it is
  # enabled on Linux/macOS only.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, race: "-race" }
          - { os: macos-latest, race: "-race" }
          - { os: windows-latest, race: "" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # Git Bash on Windows, so make runs the Makefile's loops in its sh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: build root + submodules
        run: make build-all

      - name: test root module
        run: make test TESTFLAGS="${{ matrix.race }}"

      - name: test e2e orchestrator
        run: make e2e

      - name: test submodules
        run: make test-submodules TESTFLAGS="${{ matrix.race }}"
