# Local runtime configuration. See example.config.yaml for the full
# field documentation. This file typically belongs in .gitignore - commit
# example.config.yaml as the documented reference instead.

server:
  addr: ":8080"
  handlerTimeout: 0s
  maxBodySize: 0
  strictJSON: true
  compression:
    enabled: false
    minSize: 0
    level: 0

grpc:
  addr: ":9000"
  handlerTimeout: 0s
  reflection: true

logging:
  level: info

serviceName: grpc

otel:
  enabled: true
  exporter: none
  endpoint: ""

metrics:
  enabled: true
  exporter: prometheus
  endpoint: ""
  adminAddr: ":9090"
  path: /metrics

docs:
  enabled: true
  ui: redoc
  path: /docs
  specPath: /openapi.yaml
