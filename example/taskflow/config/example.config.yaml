# Project runtime configuration - read by main.go at boot via
# config.Load(). Copy this file to `config.yaml`, edit the values for
# your environment, and commit the example only (the live file
# typically lives in `.gitignore` or is rendered from secrets/CI).
#
# Per-environment overrides go in `config.yaml` itself (one file per
# env, mounted by the deployer). craftgo reads no environment variable,
# but the OpenTelemetry SDK reads its own OTEL_* variables, such as
# OTEL_EXPORTER_OTLP_HEADERS and OTEL_TRACES_SAMPLER.

# Public HTTP listener.
#
# handlerTimeout and maxBodySize are defaults: a method's @timeout or
# @maxBodySize replaces the matching one, longer or shorter, and a route
# without one takes it. Zero sets none; the decorators still apply.
#
# The read and write deadlines and the header cap are not here: set them
# in main.go with srv.SetDefaultReadTimeout, SetDefaultWriteTimeout and
# SetDefaultMaxHeaderSize when the defaults do not fit.
server:
  addr: ":8080"               # bind address; "127.0.0.1:8080" for localhost-only
  handlerTimeout: 0s          # global default handler deadline; 0 = no cap
  maxBodySize: 0              # global default body cap (bytes); 0 = no cap
  strictJSON: true            # reject unknown fields and trailing data in JSON bodies; false ignores both
  compression:
    enabled: false            # gzip/deflate negotiated via Accept-Encoding;
                              # leave false when running behind a compressing
                              # reverse proxy (nginx/envoy/cloudfront)
    minSize: 0                # skip bodies under N bytes; 0 → framework default (1024)
    level: 0                  # gzip level 1..9; 0 → DefaultCompression

# Process-wide logger: main.go passes level to log.SetLevel, for the
# server and the generated logic alike. The default logger writes JSON
# lines; install another with log.SetDefault.
logging:
  level: info                 # debug | info | warn | error; unknown → info

# Identity of this process, shared by both telemetry signals as the
# `service.name` resource attribute. Backends key on it to tell one
# service's traces and metrics from another's. Each signal can override it
# below, but only do that to report under a different name on purpose.
serviceName: taskflow

# Distributed tracing via OpenTelemetry. The server instrumentation emits
# both signals from one wrapper, so `enabled: false` here stops the spans,
# not the request metrics - those follow metrics.enabled.
otel:
  enabled: true               # false → no spans, no traceparent header
  exporter: none              # none | stdout | otlp_grpc | otlp_http
  endpoint: ""                # OTLP collector address; ignored for none/stdout
                              # gRPC example: "otel-collector.observability:4317"
                              # HTTP example: "http://collector:4318"
  serviceName: ""             # overrides the top-level serviceName for spans

# Metrics: OpenTelemetry meter + admin scrape listener.
metrics:
  enabled: true               # false → meter stays no-op; no admin listener
  exporter: prometheus        # prometheus | otlp_grpc | otlp_http | none
  endpoint: ""                # OTLP collector address; ignored for prometheus/none
                              # gRPC example: "otel-collector.observability:4317"
                              # HTTP example: "http://collector:4318"
  serviceName: ""             # overrides the top-level serviceName for metrics
  adminAddr: ":9090"          # scrape listener address (prometheus only); empty → no listener
  path: /metrics              # route the scrape is exposed on (prometheus only)

# In-process API reference docs, served on the public API listener.
docs:
  enabled: true               # false → no docs/spec routes registered
  ui: redoc                   # redoc | swagger | scalar (assets loaded from a CDN)
  path: /docs                 # HTML docs page route
  specPath: /openapi.yaml     # route serving the raw OpenAPI document
