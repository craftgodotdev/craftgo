info:
  description: 'Taskflow - the reference craftgo application. A team task-management
    API: projects, tasks, comments, file attachments, and an admin surface. Production-shaped
    (Postgres, Docker, OpenTelemetry, health probes) and exercising most of the DSL:
    multi-package + cross-package refs, scalars, enums, generics (Page<T>), mixins,
    typed errors with bodies, security schemes + middlewares, the full validator set,
    multipart upload, @group admin routes, @sensitive, and per-method @timeout / @maxBodySize
    guards.'
  title: Taskflow API
  version: 1.2.0
openapi: 3.1.0
paths:
  /admin/stats:
    get:
      description: Server + storage counters for the admin dashboard. Public within
        the admin surface.
      operationId: Stats
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsRespBody'
          description: OK
      tags:
      - admin
  /admin/tokens:
    get:
      description: List issued API tokens (secrets are never returned here).
      operationId: ListTokens
      parameters:
      - in: query
        name: cursor
        schema:
          maxLength: 256
          type:
          - string
          - "null"
      - in: query
        name: limit
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type:
          - integer
          - "null"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTokensRespBody'
          description: OK
      security:
      - adminToken: []
      tags:
      - admin
    post:
      description: Issue a new API token. The secret is returned once.
      operationId: CreateToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenReqBody'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTokenRespBody'
          description: Created
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErr'
          description: UnprocessableEntity
      security:
      - adminToken: []
      tags:
      - admin
  /admin/tokens/{id}:
    delete:
      description: Revoke an API token.
      operationId: RevokeToken
      parameters:
      - in: path
        name: id
        required: true
        schema:
          $ref: '#/components/schemas/ID'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeTokenRespBody'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundErr'
          description: NotFound
      security:
      - adminToken: []
      tags:
      - admin
  /projects/v1:
    get:
      description: List projects (v1).
      operationId: ListProjects
      parameters:
      - in: query
        name: cursor
        schema:
          maxLength: 256
          type:
          - string
          - "null"
      - in: query
        name: limit
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type:
          - integer
          - "null"
      - in: query
        name: status
        schema:
          anyOf:
          - $ref: '#/components/schemas/ProjectStatus'
          - type: "null"
      - in: query
        name: q
        schema:
          description: Case-insensitive name search.
          maxLength: 100
          type:
          - string
          - "null"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectsRespBody'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErr'
          description: Unauthorized
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedErr'
          description: TooManyRequests
      security:
      - bearer: []
      tags:
      - projects
      - project/v1
    post:
      description: Create a project (v1).
      operationId: CreateProject
      requestBody:
        content:
          application/json:
            schema:
